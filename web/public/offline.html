<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f3f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <title>Reconnect to Echo</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #241f1f; background: #f7f3f1; color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
    main { max-width: 28rem; padding: 2rem; }
    h1 { font-size: 1.8rem; font-weight: 600; }
    p { line-height: 1.6; }
    a { display: inline-block; margin-top: .5rem; padding: .7rem 1rem; border-radius: .5rem; background: #2563eb; color: white; text-decoration: none; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { :root { color: #f3eeee; background: #121214; } }
  </style>
</head>
<body><main>
  <h1>Reconnect to Echo</h1>
  <p>Echo cannot reach its server. Start <strong>echo.exe</strong> on your computer, or check your connection to the computer hosting Echo.</p>
  <p>Your chats and bots are stored on the server and will be available when you reconnect.</p>
  <a href="/">Try again</a>
</main></body>
</html>
