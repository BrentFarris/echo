name: Nightly Builds

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      windows_sandbox_acceptance:
        description: Run Windows Docker Desktop acceptance (requires an echo-sandbox runner)
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: nightly-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Compare with last successful nightly build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Manual run requested." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_successful_sha="$(gh run list \
            --workflow "$WORKFLOW_NAME" \
            --branch "$BRANCH" \
            --event schedule \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""')"

          if [ -z "$last_successful_sha" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=No previous successful nightly build found." >> "$GITHUB_OUTPUT"
          elif [ "$last_successful_sha" = "$CURRENT_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=No commits since the last successful nightly build." >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Current commit differs from the last successful nightly build." >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Test Go and frontend
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install pinned Fossil 2.27
        env:
          FOSSIL_VERSION: "2.27"
          FOSSIL_CHECKIN: "99675884a93c09125dbfbef0ca47959626c81545c132e247e67a08bd12ac7256"
        run: |
          build_dir="$(mktemp -d)"
          curl -fsSL "https://fossil-scm.org/home/tarball/${FOSSIL_CHECKIN}/fossil-src-${FOSSIL_VERSION}.tar.gz" -o "$build_dir/fossil-src.tar.gz"
          tar -xzf "$build_dir/fossil-src.tar.gz" -C "$build_dir"
          cd "$build_dir/fossil-src-${FOSSIL_VERSION}"
          ./configure --disable-fusefs
          make -j2 fossil
          sudo install -m 0755 fossil /usr/local/bin/fossil
          fossil version

      - name: Run Go tests
        env:
          ECHO_REQUIRE_FOSSIL: "1"
        # Run against the installed Fossil even when setup-go restores cached tests.
        run: go test ./... -count=1

      - name: Test showcase plugin backend
        working-directory: examples/plugins/showcase/backend-src
        run: go test ./...

      - name: Type-check and test frontend
        working-directory: web
        run: |
          npm run check
          npm test

      - name: Build embedded frontend
        working-directory: web
        run: npm run build

      - name: Install Chromium for sandbox browser acceptance
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Verify sandbox upgrade and takeover UI
        working-directory: web
        run: npm run test:e2e -- sandbox.spec.ts

      - name: Verify semantic browser targeting and cancellation
        run: node --test sandbox/images/runtime/browser-ui.test.mjs

  sandbox-images:
    name: Build, test, and scan candidate sandbox images
    needs: [check-changes, verify]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate runtime image
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/images/runtime/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          build-args: ECHO_SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: echo-sandbox-runtime:dev
          cache-from: type=gha,scope=sandbox-runtime
          cache-to: type=gha,mode=max,scope=sandbox-runtime

      - name: Build candidate egress gateway image
        id: gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/images/gateway/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          build-args: ECHO_SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: echo-sandbox-egress:dev
          cache-from: type=gha,scope=sandbox-gateway
          cache-to: type=gha,mode=max,scope=sandbox-gateway

      - name: Run Linux Docker sandbox acceptance test
        env:
          ECHO_SANDBOX_INTEGRATION: "1"
        run: go test ./internal/sandbox -run TestDockerIntegration -count=1 -v

      - name: Verify Go and C debugging through the sandbox agent
        env:
          ECHO_SANDBOX_INTEGRATION: "1"
        run: go test ./internal/debugger -run TestDockerIntegrationCGOStepping -count=1 -v -timeout=7m

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: echo-sandbox-runtime:dev
          format: json
          output: sandbox-runtime-trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan egress gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: echo-sandbox-egress:dev
          format: json
          output: sandbox-egress-trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Emit candidate image SBOMs and licenses
        shell: bash
        run: |
          syft "echo-sandbox-runtime:dev" -o spdx-json=sandbox-runtime.spdx.json
          syft "echo-sandbox-egress:dev" -o spdx-json=sandbox-egress.spdx.json
      - name: Upload sandbox image notices and scan reports
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-image-reports
          path: |
            sandbox-*.spdx.json
            sandbox-*-trivy.json
          if-no-files-found: error
          retention-days: 30

      - name: Export candidates for publication and optional Windows acceptance
        run: docker save -o sandbox-candidates.tar echo-sandbox-runtime:dev echo-sandbox-egress:dev

      - name: Upload candidate images
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-candidates
          path: sandbox-candidates.tar
          compression-level: 0
          retention-days: 2

  windows-sandbox-acceptance:
    name: Windows Docker Desktop sandbox acceptance (manual)
    needs: [check-changes, verify, sandbox-images]
    if: github.event_name == 'workflow_dispatch' && inputs.windows_sandbox_acceptance && needs.check-changes.outputs.should_build == 'true'
    runs-on: [self-hosted, Windows, X64, echo-sandbox]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          name: sandbox-candidates

      - name: Verify Linux-container mode and load immutable images
        shell: pwsh
        run: |
          $engineOS = docker info --format '{{.OSType}}'
          $architecture = docker info --format '{{.Architecture}}'
          if ($engineOS -ne 'linux' -or @('x86_64', 'amd64') -notcontains $architecture) {
            throw "Docker Desktop must run linux/amd64 containers; got $engineOS/$architecture"
          }
          docker load -i sandbox-candidates.tar
          if ($LASTEXITCODE -ne 0) { throw "Could not load sandbox candidates" }

      - name: Run Windows Docker Desktop sandbox acceptance test
        shell: pwsh
        env:
          ECHO_SANDBOX_INTEGRATION: "1"
        run: go test ./internal/sandbox -run TestDockerIntegration -count=1 -v

  publish-sandbox-images:
    name: Publish accepted protocol-3 images
    needs: [check-changes, sandbox-images]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.publish.outputs.runtime }}
      gateway: ${{ steps.publish.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-candidates
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish images after Linux acceptance
        id: publish
        shell: bash
        run: |
          docker load -i sandbox-candidates.tar
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          protocol="$(tr -d '\r\n' < internal/sandboxprotocol/version.txt)"
          test "$protocol" = 3
          for role in runtime gateway; do
            image=echo-sandbox-runtime
            if [[ "$role" == gateway ]]; then image=echo-sandbox-egress; fi
            reference="ghcr.io/${owner}/${image}"
            docker tag "${image}:dev" "${reference}:${GITHUB_SHA}"
            docker push "${reference}:${GITHUB_SHA}"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${reference}:${GITHUB_SHA}")"
            [[ "$digest" == "${reference}@sha256:"* ]]
            echo "${role}=${digest}" >> "$GITHUB_OUTPUT"
            echo "${role}=${digest}" >> sandbox-image-digests.txt
            docker tag "${image}:dev" "${reference}:protocol-${protocol}"
            docker push "${reference}:protocol-${protocol}"
          done
      - name: Verify anonymous image access
        shell: bash
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker pull "${{ steps.publish.outputs.runtime }}"
          DOCKER_CONFIG="$anonymous_config" docker pull "${{ steps.publish.outputs.gateway }}"
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-image-reports
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-image-metadata
          path: |
            sandbox-image-digests.txt
            sandbox-*.spdx.json
            sandbox-*-trivy.json
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [check-changes, verify, publish-sandbox-images]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            archive: echo-windows-nightly.zip
          - target: linux
            os: ubuntu-24.04
            archive: echo-linux-nightly.tar.gz
          - target: macos
            os: macos-latest
            archive: echo-macos-nightly.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test Go on target platform
        run: go test ./...

      - name: Build embedded Echo binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $sandboxLdflags = "-X github.com/brent/echo/internal/sandbox.RuntimeImage=${{ needs.publish-sandbox-images.outputs.runtime }} -X github.com/brent/echo/internal/sandbox.GatewayImage=${{ needs.publish-sandbox-images.outputs.gateway }}"
          if ($env:RUNNER_OS -eq "Windows") {
            go build -trimpath -ldflags $sandboxLdflags -o build/echo.exe .
          } else {
            go build -trimpath -ldflags $sandboxLdflags -o build/echo .
          }

      - name: Package build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if ($env:RUNNER_OS -eq "Windows") {
            Compress-Archive -LiteralPath "build/echo.exe" -DestinationPath "dist/${{ matrix.archive }}" -Force
          } else {
            tar -czf "dist/${{ matrix.archive }}" -C "build" "echo"
          }

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-${{ matrix.target }}-nightly
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create nightly release
    needs: [check-changes, verify, publish-sandbox-images, build]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: echo-*-nightly
          path: release-assets
          merge-multiple: true

      - name: Download sandbox image metadata
        uses: actions/download-artifact@v4
        with:
          name: sandbox-image-metadata
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          CHECK_REASON: ${{ needs.check-changes.outputs.reason }}
        run: |
          release_date="$(date -u +%Y-%m-%d)"
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          {
            echo "Automated nightly build for ${SOURCE_SHA}."
            echo
            echo "${CHECK_REASON}"
          } > release-notes.md
          gh release create "$tag" release-assets/* \
            --target "$SOURCE_SHA" \
            --title "Echo Nightly $release_date" \
            --notes-file release-notes.md
